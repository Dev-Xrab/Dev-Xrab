<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
text{font-family:'Cascadia Mono','Consolas','Courier New',monospace}
.title{font-size:18px;font-weight:700;fill:#39d353}
.key{font-size:14px;font-weight:700;fill:#58a6ff}
.value{font-size:14px;fill:#c9d1d9}
.muted{font-size:12px;fill:#8b949e}
</style>
<rect width="100%" height="100%" rx="14" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="559" height="249" rx="14" fill="none" stroke="#30363d"/>
<circle cx="22" cy="20" r="5" fill="#ff5f56"/>
<circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
<circle cx="58" cy="20" r="5" fill="#27c93f"/>
<text x="24" y="58" class="title">Dev-Xrab@github</text>
<text x="24" y="80" class="muted">profile://whoami</text>
