<animate attributeName="opacity" from="0" to="1" begin="0.27s" dur="0.28s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.27s" dur="0.28s" fill="freeze"/>
</g>
<g opacity="0" transform="translate(0,8)">
<text x="24" y="170" class="key">focus       </text>
<text x="142" y="170" class="value">Front and Backend  Development</text>
<animate attributeName="opacity" from="0" to="1" begin="0.39s" dur="0.28s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.39s" dur="0.28s" fill="freeze"/>
</g>
<g opacity="0" transform="translate(0,8)">
