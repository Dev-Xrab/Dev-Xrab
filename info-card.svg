<animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.63s" dur="0.28s" fill="freeze"/>
</g>
<line x1="24" y1="326" x2="536" y2="326" stroke="#30363d"/>
<text x="24" y="346" class="muted">$ build → debug → understand → repeat</text>
</svg>